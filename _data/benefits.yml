# Benefits section cards
# Add, remove, or reorder cards by editing this array

title: "For customers & local sellers"
subtitle: "ghantiGo is built for both sides of the lane — those who sell or serve, and those who live nearby."

# Customer-facing benefits
customer_title: "For customers"
customer_subtitle: "On the ghantiGo app for customers"
customer_cards:
  - icon: "🔔"
    heading: "Digital ghanti"
    hindi: "फोन पे घंटी"
    description: "Get notified when your regular moving seller or repairwala is near your gate or chowk."

  - icon: "🚶"
    heading: "Walk, don't drive"
    hindi: "पास में ही है"
    description: "They’re already 200 meters away. Walk over instead of driving to the city for repairs or shopping."

  - icon: "💰"
    heading: "Save money"
    hindi: "पैसे बचाओ"
    description: "Local prices, no delivery fees, no middleman. Buy fresh or repair for less."

  - icon: "🌍"
    heading: "Waste less"
    hindi: "कम कचरा"
    description: "Repair what you have instead of replacing it. One less item in the landfill."

# Vendor / seller-facing benefits
vendor_title: "For feriwale & service providers"
vendor_subtitle: "On the ghantiGo app for sellers"
vendor_cards:
  - icon: "📣"
    heading: "Go LIVE"
    hindi: "लाइव जाओ"
    description: "Tap a button when you arrive at a chowk, society, or village. Customers nearby get your digital ghanti."

  - icon: "📸"
    heading: "Show today's offering"
    hindi: "आज क्या लाये हो"
    description: "Upload a photo and record a voice broadcast so customers know what you brought or what you can fix."

  - icon: "🎯"
    heading: "Build regulars"
    hindi: "अपने ग्राहक बनाओ"
    description: "Customers follow you. They wait for you. No more shouting or hoping someone hears your bell."

  - icon: "🚚"
    heading: "Move smarter"
    hindi: "सही जगह, सही समय"
    description: "Plan village-to-village or society-to-society rounds based on where people follow you."
