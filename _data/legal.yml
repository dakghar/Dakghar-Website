# Legal information for Privacy Policy, Terms, and Support pages
# Edit these values before submitting to Google Play Store and DLT registration

# Grievance Officer (required under DPDP Act)
grievance_officer:
  name: "[UPDATE: Grievance Officer name]"
  designation: "Grievance Officer"
  email: "[UPDATE: grievance@ghantigo.com]" # Update with actual email
  response_time: "90 days" # Maximum under DPDP Act

# Account deletion
account_deletion:
  email: "[UPDATE: delete@ghantigo.com]" # Update with actual email
  processing_time: "30 days"
  in_app_path:
    - "Open the ghantiGo app"
    - "Go to Settings"
    - "Tap Account"
    - "Tap Delete Account"
    - "Confirm deletion"

# Third-party services (must be disclosed in Privacy Policy)
third_parties:
  sms_gateway: "[UPDATE: SMS gateway provider name]"
  payment_processors:
    - "Razorpay"
    - "PayU"
  analytics: "[UPDATE: Analytics SDK name]"
  cloud_provider: "[UPDATE: Cloud hosting provider]"

# Data retention
data_retention:
  location_days: "[UPDATE: Number of days location data is retained]"
  transaction_days: 365 # 1 year for financial records
  security_logs_days: 365 # Minimum 1 year per DPDP Rules 2025
  account_data_after_deletion_days: 90 # Grace period for legal obligations

# Policy dates
privacy_policy:
  effective_date: "[UPDATE: 2026-06-24]"
  last_updated: "[UPDATE: 2026-06-24]"

terms:
  effective_date: "[UPDATE: 2026-06-24]"
  last_updated: "[UPDATE: 2026-06-24]"
